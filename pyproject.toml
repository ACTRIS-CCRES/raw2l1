[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raw2l1"
version = "3.2.4"
description = "Convert raw lidar/radiometer files to level-1 NetCDF products"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "netCDF4>=1.6",
    "gitpython",
    "xarray",
]

[project.scripts]
raw2l1 = "raw2l1.raw2l1:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raw2l1 = ["conf/*.ini"]

[dependency-groups]
dev = [
    "commitizen>=4.13.10",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]
