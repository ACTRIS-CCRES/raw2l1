name: publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish-PyPi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Hatch
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Publish to PyPI
        env:
          HATCH_INDEX_USER: __token__
          HATCH_INDEX_AUTH: ${{ secrets.PYPI_TOKEN }}
        run: hatch publish

      - name: Generate changelog
        run: |
          version=${GITHUB_REF#refs/tags/v}
          awk '/^## /{n++} n==1' CHANGELOG.md > ${{ github.workspace }}-CHANGELOG.txt
          echo "name=raw2l1 $version" >> $GITHUB_OUTPUT
        id: changelog

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.changelog.outputs.name }}
          body_path: ${{ github.workspace }}-CHANGELOG.txt
